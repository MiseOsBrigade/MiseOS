name: Secret Scan
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  basic-secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for obvious committed secrets
        shell: bash
        run: |
          ! grep -RInE "(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|AWS_SECRET_ACCESS_KEY|GITHUB_TOKEN=)" .             --exclude-dir=.git --exclude-dir=node_modules
