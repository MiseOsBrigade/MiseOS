name: Repo Steward
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
  pull-requests: write
jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
