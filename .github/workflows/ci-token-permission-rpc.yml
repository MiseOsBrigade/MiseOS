name: "ci / tools/token-permission-rpc"

on:
  push:
    branches: [main]
    paths: ["tools/token-permission-rpc/**", ".github/workflows/ci-token-permission-rpc.yml"]
  pull_request:
    paths: ["tools/token-permission-rpc/**", ".github/workflows/ci-token-permission-rpc.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/token-permission-rpc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
