name: "ci / apps/character-studio"

on:
  push:
    branches: [main]
    paths: ["apps/character-studio/**", ".github/workflows/ci-character-studio.yml"]
  pull_request:
    paths: ["apps/character-studio/**", ".github/workflows/ci-character-studio.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/character-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
