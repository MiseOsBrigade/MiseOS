name: AID-1 IETF Publication Gate

on:
  push:
    branches:
      - "ietf/aid1-publication"
    paths:
      - "standards/aid1/**"
      - ".github/workflows/ietf-aid1-publication.yml"
  pull_request:
    paths:
      - "standards/aid1/**"
      - ".github/workflows/ietf-aid1-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-render-idnits:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract AID-1 publication package
        run: |
          rm -rf .aid1-publish
          mkdir -p .aid1-publish
          unzip -q standards/aid1/aid1-ietf-ci-package.zip -d .aid1-publish

      - name: Install IETF authoring tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "xml2rfc==3.34.0" rfclint
          npm install --global @ietf-tools/idnits

      - name: Tool versions
        run: |
          xml2rfc --version
          rfclint --version || true
          idnits --version || true

      - name: Validate, render, and run idnits
        working-directory: .aid1-publish
        run: bash scripts/ietf-publish-check.sh

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aid1-ietf-publication-artifacts
          path: |
            .aid1-publish/publish/**
            .aid1-publish/reports/**
          if-no-files-found: warn
          retention-days: 30
