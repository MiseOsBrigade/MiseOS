name: "ci / tools/chaingate"

on:
  push:
    branches: [main]
    paths: ["tools/chaingate/**", ".github/workflows/ci-chaingate.yml"]
  pull_request:
    paths: ["tools/chaingate/**", ".github/workflows/ci-chaingate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/chaingate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run test
