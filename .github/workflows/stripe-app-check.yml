name: Stripe App Check

on:
  pull_request:
    paths:
      - "integrations/stripe-app/**"
      - ".github/workflows/stripe-app-check.yml"
  push:
    branches: [main]
    paths:
      - "integrations/stripe-app/**"
      - ".github/workflows/stripe-app-check.yml"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/stripe-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate repository-side configuration
        env:
          MISEOS_METADATA_API_URL: https://metadata.example.com
          MISEOS_CHAIN_ID: "84532"
          MISEOS_NFT_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
        run: npm run check
      - name: Explain Stripe validation boundary
        run: echo "Stripe manifest validation/upload requires an authenticated Stripe CLI and is not performed by this secret-free PR check."
