name: "ci / apps/voxel-world"

on:
  push:
    branches: [main]
    paths: ["apps/voxel-world/**", ".github/workflows/ci-voxel-world.yml"]
  pull_request:
    paths: ["apps/voxel-world/**", ".github/workflows/ci-voxel-world.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/voxel-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test
