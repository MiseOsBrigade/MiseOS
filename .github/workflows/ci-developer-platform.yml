name: "ci / apps/developer-platform"

on:
  push:
    branches: [main]
    paths: ["apps/developer-platform/**", ".github/workflows/ci-developer-platform.yml"]
  pull_request:
    paths: ["apps/developer-platform/**", ".github/workflows/ci-developer-platform.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/developer-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
