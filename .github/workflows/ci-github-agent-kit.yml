name: "ci / tools/github-agent-kit"

on:
  push:
    branches: [main]
    paths: ["tools/github-agent-kit/**", ".github/workflows/ci-github-agent-kit.yml"]
  pull_request:
    paths: ["tools/github-agent-kit/**", ".github/workflows/ci-github-agent-kit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/github-agent-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
