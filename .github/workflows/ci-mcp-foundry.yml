name: "ci / apps/mcp-foundry"

on:
  push:
    branches: [main]
    paths: ["apps/mcp-foundry/**", ".github/workflows/ci-mcp-foundry.yml"]
  pull_request:
    paths: ["apps/mcp-foundry/**", ".github/workflows/ci-mcp-foundry.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-foundry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
