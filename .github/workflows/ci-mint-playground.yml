name: "ci / apps/mint-playground"

on:
  push:
    branches: [main]
    paths: ["apps/mint-playground/**", ".github/workflows/ci-mint-playground.yml"]
  pull_request:
    paths: ["apps/mint-playground/**", ".github/workflows/ci-mint-playground.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mint-playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
