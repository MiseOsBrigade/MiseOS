name: "ci / apps/bootstrap-registry"

on:
  push:
    branches: [main]
    paths: ["apps/bootstrap-registry/**", ".github/workflows/ci-bootstrap-registry.yml"]
  pull_request:
    paths: ["apps/bootstrap-registry/**", ".github/workflows/ci-bootstrap-registry.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bootstrap-registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run test
