name: "ci / apps/miseos-platform"

on:
  push:
    branches: [main]
    paths: ["apps/miseos-platform/**", ".github/workflows/ci-miseos-platform.yml"]
  pull_request:
    paths: ["apps/miseos-platform/**", ".github/workflows/ci-miseos-platform.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/miseos-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
