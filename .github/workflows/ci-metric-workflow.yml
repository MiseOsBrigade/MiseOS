name: "ci / apps/metric-workflow"

on:
  push:
    branches: [main]
    paths: ["apps/metric-workflow/**", ".github/workflows/ci-metric-workflow.yml"]
  pull_request:
    paths: ["apps/metric-workflow/**", ".github/workflows/ci-metric-workflow.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/metric-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
