name: "ci / packages/mise-config"

on:
  push:
    branches: [main]
    paths: ["packages/mise-config/**", ".github/workflows/ci-mise-config.yml"]
  pull_request:
    paths: ["packages/mise-config/**", ".github/workflows/ci-mise-config.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mise-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
