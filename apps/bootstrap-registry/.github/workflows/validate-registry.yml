name: Validate MiseOS Registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm verify
      - name: Upload analytics reports
        uses: actions/upload-artifact@v4
        with:
          name: miseos-registry-reports
          path: |
            reports/
            analytics/
            dist/
            docs/registry-dashboard.md
