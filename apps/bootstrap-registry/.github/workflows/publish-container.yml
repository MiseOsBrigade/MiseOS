name: Publish Containers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: miseos-runner
            context: containers/runner
          - name: miseos-policy-checker
            context: containers/policy-checker
          - name: miseos-docs-builder
            context: containers/docs-builder
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: |
            ghcr.io/mise-os/${{ matrix.image.name }}:${{ github.ref_name }}
            ghcr.io/mise-os/${{ matrix.image.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest container provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/mise-os/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
