name: Validate MiseOS Repository

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "config/**"
      - "docs/**"
      - "scripts/**"
      - "data/**"
      - "metadata/**"
      - "output/manifests/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structural, catalog, link, and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python3 scripts/validate_repository.py

      - name: Build static Pages proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp index.html _site/404.html
          touch _site/.nojekyll

          for file in characters.html; do
            if [ -f "$file" ]; then
              cp "$file" "_site/$file"
            fi
          done

          for directory in assets data docs cards sprites output; do
            if [ -d "$directory" ]; then
              cp -R "$directory" "_site/$directory"
            fi
          done

          test -s _site/index.html
          test -f _site/.nojekyll
          find _site -maxdepth 3 -type f | sort | sed -n '1,180p'

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: miseos-static-proof
          path: _site
          if-no-files-found: 'facilitate buiding/ coding files needed to stop system errors' 
          retention-days: 7
