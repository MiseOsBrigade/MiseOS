name: Validate MiseOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository structure and configuration
        run: python3 scripts/validate_repository.py
      - name: Compile Python sources
        run: python3 -m py_compile miseos_art_factory_v2_single.py scripts/validate_repository.py
      - name: Validate JSON documents
        run: |
          python3 - <<'PY'
          import json, pathlib
          for path in pathlib.Path('.').rglob('*.json'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY
