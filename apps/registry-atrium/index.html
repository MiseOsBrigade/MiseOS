<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070706" />
  <meta name="description" content="MiseOS Registry Atrium — an interactive 3D exhibition of the Mise Orchestra agent roster." />
  <title>MiseOS Registry Atrium</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --ink: #f6f0dd;
      --muted: #a7a192;
      --gold: #f0c96b;
      --gold-soft: rgba(240, 201, 107, .18);
      --surface: rgba(13, 13, 12, .72);
      --surface-strong: rgba(18, 18, 16, .94);
      --border: rgba(240, 201, 107, .22);
      --shadow: 0 26px 80px rgba(0,0,0,.56);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 42%, rgba(240, 201, 107, .08), transparent 28%),
        radial-gradient(circle at 16% 18%, rgba(64, 123, 255, .08), transparent 26%),
        radial-gradient(circle at 84% 74%, rgba(150, 66, 255, .08), transparent 28%),
        #070706;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -.01em;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    canvas { display: block; }
    ::selection { background: var(--gold); color: #12100a; }
    ::-webkit-scrollbar { width: 7px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,.04); }
    ::-webkit-scrollbar-thumb { background: rgba(240,201,107,.25); border-radius: 999px; }

    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 14px 42px rgba(0,0,0,.32);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #070706;
      transition: opacity .9s ease, visibility .9s ease;
    }
    .loading-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-wrap { display: grid; justify-items: center; gap: 18px; }
    .loader-mark {
      width: 72px; height: 72px; position: relative;
      display: grid; place-items: center;
    }
    .loader-mark::before, .loader-mark::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(240,201,107,.2);
      border-top-color: var(--gold);
      animation: spin 1.2s linear infinite;
    }
    .loader-mark::after { inset: 12px; animation-direction: reverse; animation-duration: .9s; }
    .loader-core { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 24px var(--gold); }
    .loading-title { font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }

    #canvas-container { position: fixed; inset: 0; }

    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .ui-layer.is-ready { opacity: 1; }

    .topbar {
      position: absolute; inset: 0 0 auto 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 24px; padding: 26px 28px;
    }
    .brand { display: flex; align-items: center; gap: 13px; pointer-events: auto; }
    .brand-mark {
      width: 42px; height: 42px; border: 1px solid var(--border); border-radius: 13px;
      display: grid; place-items: center; background: rgba(7,7,6,.72);
      box-shadow: inset 0 0 24px rgba(240,201,107,.06), 0 0 30px rgba(240,201,107,.06);
    }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand h1 { margin: 0; font-size: clamp(20px, 2.5vw, 31px); line-height: .9; letter-spacing: -.055em; }
    .brand p { margin: 7px 0 0; font-size: 10px; letter-spacing: .23em; text-transform: uppercase; color: var(--muted); }

    .system-readout { display: flex; align-items: stretch; gap: 8px; pointer-events: auto; }
    .readout-cell { min-width: 92px; padding: 10px 12px; border-radius: 12px; }
    .readout-label { display: block; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: #8f897b; }
    .readout-value { display: block; margin-top: 4px; font-size: 12px; font-weight: 700; }
    .status-dot { display:inline-block; width: 7px; height:7px; border-radius:50%; margin-right:6px; background:#7ae6a4; box-shadow:0 0 12px rgba(122,230,164,.6); }

    .filter-rail {
      position: absolute; left: 28px; top: 50%; transform: translateY(-50%);
      display: grid; gap: 8px; pointer-events: auto;
    }
    .filter-button {
      width: 168px; border: 1px solid rgba(240,201,107,.14); border-radius: 13px;
      padding: 11px 13px; text-align: left; background: rgba(8,8,7,.62); cursor: pointer;
      transition: border-color .25s ease, background .25s ease, transform .25s ease, color .25s ease;
    }
    .filter-button:hover, .filter-button:focus-visible { transform: translateX(4px); border-color: rgba(240,201,107,.48); outline: none; }
    .filter-button.is-active { background: rgba(240,201,107,.12); border-color: rgba(240,201,107,.55); }
    .filter-button strong { display:block; font-size: 12px; }
    .filter-button span { display:block; margin-top: 3px; color: #8d8779; font-size: 10px; }

    .bottom-controls {
      position: absolute; inset: auto 28px 25px 28px;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 18px;
    }
    .instruction {
      justify-self: center; pointer-events: auto; border-radius: 999px; padding: 11px 17px;
      font-size: 11px; letter-spacing: .03em; color: #cbc4b3; white-space: nowrap;
    }
    .instruction b { color: var(--ink); font-weight: 650; }
    .control-cluster { justify-self: end; display: flex; gap: 8px; pointer-events: auto; }
    .icon-button {
      min-height: 42px; border: 1px solid var(--border); border-radius: 12px; padding: 0 14px;
      display: inline-flex; align-items: center; gap: 9px; background: rgba(13,13,12,.72); cursor: pointer;
      transition: background .2s ease, transform .2s ease, border-color .2s ease;
    }
    .icon-button:hover, .icon-button:focus-visible { background: rgba(240,201,107,.1); border-color: rgba(240,201,107,.5); outline:none; }
    .icon-button:active { transform: scale(.97); }
    .icon-button svg { width: 16px; height:16px; }
    .icon-button span { font-size: 11px; font-weight: 650; }
    .indicator { width: 7px; height:7px; border-radius:50%; background:#7ae6a4; box-shadow:0 0 12px rgba(122,230,164,.6); }
    .indicator.off { background:#817c72; box-shadow:none; }

    .roster-panel {
      position: fixed; z-index: 30; top: 16px; right: 16px; bottom: 16px;
      width: min(390px, calc(100vw - 32px)); padding: 18px; border-radius: 20px;
      transform: translateX(calc(100% + 32px)); transition: transform .45s cubic-bezier(.2,.8,.2,1);
      pointer-events: auto; display: flex; flex-direction: column;
    }
    .roster-panel.is-open { transform: translateX(0); }
    .panel-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .panel-head h2 { margin:0; font-size:22px; letter-spacing:-.04em; }
    .panel-head p { margin:6px 0 0; color:var(--muted); font-size:12px; }
    .close-button { width:38px; height:38px; padding:0; justify-content:center; }
    .search-wrap { margin-top:16px; position:relative; }
    .search-wrap svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:15px; color:#827c6f; }
    #roster-search { width:100%; border:1px solid rgba(240,201,107,.17); border-radius:12px; background:rgba(255,255,255,.035); color:var(--ink); padding:12px 13px 12px 39px; outline:none; }
    #roster-search:focus { border-color:rgba(240,201,107,.55); box-shadow:0 0 0 3px rgba(240,201,107,.08); }
    .roster-list { margin-top:14px; overflow:auto; display:grid; gap:7px; padding-right:4px; }
    .roster-item { border:1px solid rgba(255,255,255,.07); border-radius:13px; background:rgba(255,255,255,.025); padding:11px; cursor:pointer; text-align:left; display:grid; grid-template-columns:38px 1fr auto; gap:10px; align-items:center; }
    .roster-item:hover, .roster-item:focus-visible { border-color:rgba(240,201,107,.4); background:rgba(240,201,107,.07); outline:none; }
    .roster-number { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; background:rgba(240,201,107,.08); color:var(--gold); font-size:10px; font-weight:800; }
    .roster-item strong { display:block; font-size:12px; }
    .roster-item small { display:block; margin-top:3px; color:#8f897c; font-size:10px; }
    .rarity-mini { font-size:9px; letter-spacing:.09em; text-transform:uppercase; color:#b8b09f; }

    .modal {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
      padding: 20px; background: rgba(4,4,4,.72); backdrop-filter: blur(10px);
      opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s ease;
    }
    .modal.is-open { opacity: 1; visibility: visible; }
    .modal-card {
      width: min(1040px, 100%); max-height: min(760px, calc(100vh - 40px)); overflow: hidden;
      display: grid; grid-template-columns: minmax(320px, .9fr) minmax(390px, 1.1fr);
      border-radius: 24px; background: var(--surface-strong); border: 1px solid rgba(240,201,107,.25);
      box-shadow: var(--shadow); transform: translateY(18px) scale(.975); transition: transform .4s cubic-bezier(.2,.8,.2,1);
    }
    .modal.is-open .modal-card { transform: translateY(0) scale(1); }
    .modal-media { min-height: 570px; position:relative; background:#080807; display:grid; place-items:center; overflow:hidden; }
    .modal-media::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent 65%, rgba(18,18,16,.95)); pointer-events:none; }
    .modal-media img { width:100%; height:100%; object-fit:cover; }
    .modal-copy { position:relative; min-width:0; overflow:auto; padding:38px 38px 30px; }
    .modal-close { position:absolute; top:16px; right:16px; z-index:2; }
    .eyeline { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding-right:48px; }
    .chip { border:1px solid rgba(240,201,107,.23); border-radius:999px; padding:6px 9px; font-size:9px; font-weight:750; letter-spacing:.11em; text-transform:uppercase; color:#d7cfbb; }
    .chip.rarity { color:var(--gold); background:rgba(240,201,107,.08); }
    .modal-title { margin:18px 0 0; font-size:clamp(34px,5vw,58px); line-height:.91; letter-spacing:-.065em; }
    .modal-role { margin:12px 0 0; color:var(--gold); font-size:14px; font-weight:700; }
    .modal-desc { margin:18px 0 0; color:#b6af9f; font-size:14px; line-height:1.7; }
    .command { margin-top:20px; border-left:2px solid var(--gold); padding:10px 13px; background:rgba(240,201,107,.055); font:700 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; color:#e7dcbf; }
    .traits { margin-top:22px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .trait { border-top:1px solid rgba(255,255,255,.08); padding-top:10px; }
    .trait-label { display:block; font-size:9px; text-transform:uppercase; letter-spacing:.13em; color:#7f796e; }
    .trait-value { display:block; margin-top:5px; font-size:12px; font-weight:700; }
    .stats-title { margin:24px 0 12px; font-size:10px; text-transform:uppercase; letter-spacing:.16em; color:#8c867a; }
    .stats { display:grid; gap:10px; }
    .stat-row { display:grid; grid-template-columns:82px 1fr 28px; gap:10px; align-items:center; }
    .stat-name { font-size:10px; color:#aaa394; }
    .stat-track { height:5px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.07); }
    .stat-fill { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,#b58a36,var(--gold)); box-shadow:0 0 14px rgba(240,201,107,.25); transition:width .7s .15s ease; }
    .stat-value { font:700 10px ui-monospace, SFMono-Regular, Menlo, monospace; color:#d9d1bf; text-align:right; }

    .screenreader-status { position:fixed; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

    @media (max-width: 900px) {
      .filter-rail { display:none; }
      .system-readout .readout-cell:first-child { display:none; }
      .bottom-controls { grid-template-columns: 1fr auto; }
      .instruction { display:none; }
      .modal-card { grid-template-columns: 1fr; max-height:calc(100vh - 24px); overflow:auto; }
      .modal-media { min-height:0; aspect-ratio: 768 / 850; }
      .modal-media::after { background:linear-gradient(0deg,rgba(18,18,16,.96),transparent 30%); }
      .modal-copy { overflow:visible; padding:28px 24px 26px; }
    }
    @media (max-width: 600px) {
      .topbar { padding:18px; }
      .brand-mark { width:38px; height:38px; }
      .brand p { display:none; }
      .system-readout .readout-cell { min-width:auto; }
      .readout-label { display:none; }
      .bottom-controls { inset:auto 16px 16px 16px; }
      .control-cluster { gap:6px; }
      .icon-button { padding:0 12px; }
      .icon-button .button-label { display:none; }
      .modal { padding:12px; }
      .modal-title { font-size:38px; }
      .traits { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
    }
  </style>
</head>
<body>
  <div id="loading-screen" class="loading-screen" aria-live="polite">
    <div class="loader-wrap">
      <div class="loader-mark"><span class="loader-core"></span></div>
      <div class="loading-title">Calibrating Mise Orchestra</div>
    </div>
  </div>

  <div id="canvas-container" aria-label="Interactive 3D MiseOS agent registry"></div>

  <div id="ui-layer" class="ui-layer">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 17.5V6.5L9.2 12 12 8.6 14.8 12 20 6.5v11" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M4 17.5h16" stroke="#f0c96b" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>MISEOS</h1>
          <p>Registry Atrium · Season 1</p>
        </div>
      </div>

      <div class="system-readout">
        <div class="readout-cell glass">
          <span class="readout-label">Registry</span>
          <span class="readout-value"><span class="status-dot"></span>Canonical</span>
        </div>
        <div class="readout-cell glass">
          <span class="readout-label">Agents</span>
          <span class="readout-value" id="agent-count">23 active</span>
        </div>
      </div>
    </header>

    <nav id="filter-rail" class="filter-rail" aria-label="Filter agents by department"></nav>

    <div class="bottom-controls">
      <div></div>
      <div class="instruction glass"><b>Drag</b> orbit · <b>Scroll</b> zoom · <b>Click</b> inspect agent</div>
      <div class="control-cluster">
        <button id="roster-button" class="icon-button" type="button" aria-expanded="false" aria-controls="roster-panel">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7h10M7 12h10M7 17h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="4" cy="7" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="17" r="1" fill="currentColor"/></svg>
          <span class="button-label">Roster</span>
        </button>
        <button id="auto-rotate-button" class="icon-button" type="button" aria-pressed="true">
          <span id="rotate-indicator" class="indicator" aria-hidden="true"></span>
          <span class="button-label">Orbit</span>
        </button>
      </div>
    </div>
  </div>

  <aside id="roster-panel" class="roster-panel glass" aria-hidden="true">
    <div class="panel-head">
      <div><h2>Agent Registry</h2><p>Search and focus any Season 1 operative.</p></div>
      <button id="roster-close" class="icon-button close-button" type="button" aria-label="Close roster">
        <svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="roster-search" type="search" placeholder="Search name, role, department…" autocomplete="off" />
    </div>
    <div id="roster-list" class="roster-list"></div>
  </aside>

  <div id="detail-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <article class="modal-card">
      <div class="modal-media"><img id="modal-image" alt="" /></div>
      <div class="modal-copy">
        <button id="modal-close" class="icon-button close-button modal-close" type="button" aria-label="Close agent details">
          <svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="eyeline">
          <span id="modal-number" class="chip"></span>
          <span id="modal-department" class="chip"></span>
          <span id="modal-rarity" class="chip rarity"></span>
        </div>
        <h2 id="modal-title" class="modal-title"></h2>
        <p id="modal-role" class="modal-role"></p>
        <p id="modal-description" class="modal-desc"></p>
        <div id="modal-command" class="command"></div>
        <div class="traits">
          <div class="trait"><span class="trait-label">Function</span><span id="modal-function" class="trait-value"></span></div>
          <div class="trait"><span class="trait-label">Ability</span><span id="modal-ability" class="trait-value"></span></div>
          <div class="trait"><span class="trait-label">Element</span><span id="modal-element" class="trait-value"></span></div>
          <div class="trait"><span class="trait-label">Tier</span><span id="modal-tier" class="trait-value"></span></div>
        </div>
        <h3 class="stats-title">Operational telemetry</h3>
        <div id="modal-stats" class="stats"></div>
      </div>
    </article>
  </div>

  <div id="screenreader-status" class="screenreader-status" aria-live="polite"></div>

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const container = document.getElementById('canvas-container');

      );
      ring.rotation.x = Math.PI / 2 + index * .48;
      ring.rotation.y = index * .72;

      const localIndex = inner ? index - 12 : index;

      const angle = (localIndex / count) * Math.PI * 2 + (inner ? Math.PI / 11 : 0);
      const y = inner ? -1.25 + Math.sin(angle * 2) * .35 : 1.22 + Math.sin(angle * 3) * .28;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.lookAt(0, y * .22, 0);
      group.rotateY(Math.PI); // card faces outward toward orbiting camera

      }));
      frame.castShadow = true;
      frame.receiveShadow = true;
      group.add(frame);

      const texture = textureLoader.load(agent.image);
      texture.encoding = THREE.sRGBEncoding;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const image = new THREE.Mesh(imageGeometry, new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
      image.position.z = .088;
      image.userData.agentId = agent.id;
      image.userData.department = agent.department;
      group.add(image);
      selectable.push(image);

      );
      halo.position.z = -.11;
      group.add(halo);

      galleryGroup.add(group);
      agentObjects.set(agent.id, { group, image, frame, halo });
    });

    // Ambient signal particles
    const particleCount = 950;
    const particleGeometry = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particlePositions.length; i += 3) {
      const radius = 4 + Math.random() * 18;
      const angle = Math.random() * Math.PI * 2;
      particlePositions[i] = Math.cos(angle) * radius;
      particlePositions[i + 1] = (Math.random() - .5) * 15;
      particlePositions[i + 2] = Math.sin(angle) * radius;
    }
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particles = new THREE.Points(particleGeometry, new THREE.PointsMaterial({ size: .025, color: 0xe8dcc0, transparent: true, opacity: .42, depthWrite: false }));
    scene.add(particles);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(99, 99);
    let hoveredObject = null;

    let modalOpen = false;
    let rosterOpen = false;
    let orbitEnabled = controls.autoRotate;

    function setPointer(event) {
      pointer.x = (event.clientX / innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;
    }

    function hitTest() {
      raycaster.setFromCamera(pointer, camera);
      return raycaster.intersectObjects(selectable, false).find(hit => {
        const agent = agents.find(item => item.id === hit.object.userData.agentId);
        return activeFilter === 'All' || agent?.department === activeFilter;
      });
    }

    renderer.domElement.addEventListener('pointermove', event => {
      setPointer(event);
      if (!modalOpen && !rosterOpen) {
        gsap.to(galleryGroup.rotation, { x: pointer.y * .02, z: -pointer.x * .012, duration: .9, overwrite: true });
      }
      const hit = hitTest();
      const next = hit?.object || null;
      if (next !== hoveredObject) {
        if (hoveredObject) {
          const old = agentObjects.get(hoveredObject.userData.agentId)?.group;
          if (old) gsap.to(old.scale, { x:1, y:1, z:1, duration:.25, overwrite:true });
        }
        hoveredObject = next;
        renderer.domElement.style.cursor = next ? 'pointer' : 'grab';
        if (next) {
          const group = agentObjects.get(next.userData.agentId)?.group;
          if (group) gsap.to(group.scale, { x:1.055, y:1.055, z:1.055, duration:.25, overwrite:true });
        }
      }
    });

    renderer.domElement.addEventListener('pointerdown', () => { renderer.domElement.style.cursor = 'grabbing'; });
    renderer.domElement.addEventListener('pointerup', event => {
      renderer.domElement.style.cursor = hoveredObject ? 'pointer' : 'grab';
      setPointer(event);
      const hit = hitTest();
      if (hit && !modalOpen && !rosterOpen) {
        const agent = agents.find(item => item.id === hit.object.userData.agentId);
        if (agent) focusAgent(agent, true);
      }
    });

    function focusAgent(agent, showModal = true) {
      const object = agentObjects.get(agent.id);
      if (!object) return;
      orbitEnabled = controls.autoRotate;
      controls.autoRotate = false;
      updateOrbitUI();

      const target = new THREE.Vector3();
      object.group.getWorldPosition(target);
      const outward = target.clone(); outward.y = 0; outward.normalize();
      const destination = target.clone().add(outward.multiplyScalar(4.1));
      destination.y += .18;

      gsap.to(controls.target, { x:target.x, y:target.y, z:target.z, duration:1.15, ease:'power2.inOut', overwrite:true });
      gsap.to(camera.position, {
        x:destination.x, y:destination.y, z:destination.z,
        duration:1.15, ease:'power2.inOut', overwrite:true,
        onUpdate:() => controls.update(),
        onComplete:() => { if (showModal) openModal(agent); }
      });
    }

    function resetView() {
      gsap.to(controls.target, { x:0, y:0, z:0, duration:.85, ease:'power2.inOut' });
      const length = Math.max(13.5, camera.position.length());
      const destination = camera.position.clone().normalize().multiplyScalar(Math.min(length, 17));
      destination.y = Math.max(.8, destination.y);
      gsap.to(camera.position, { x:destination.x, y:destination.y, z:destination.z, duration:.85, ease:'power2.inOut', onUpdate:() => controls.update() });
      controls.autoRotate = orbitEnabled && !reducedMotion;
      updateOrbitUI();
    }

    // Modal
    const modal = document.getElementById('detail-modal');
    const modalClose = document.getElementById('modal-close');

    function openModal(agent) {

      document.getElementById('modal-number').textContent = `MISE-${agent.cardNumber}`;
      document.getElementById('modal-department').textContent = agent.department;
      document.getElementById('modal-rarity').textContent = agent.rarity;
      document.getElementById('modal-title').textContent = agent.name;
      document.getElementById('modal-role').textContent = agent.role;
      document.getElementById('modal-description').textContent = agent.description;
      document.getElementById('modal-command').textContent = `> ${agent.command}`;

      document.getElementById('modal-element').textContent = agent.element;
      document.getElementById('modal-tier').textContent = agent.tier;

          <span class="stat-name">${stat.label}</span>
          <div class="stat-track"><div class="stat-fill" data-value="${stat.value}"></div></div>
          <span class="stat-value">${stat.value}</span>
        </div>`).join('');
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden','false');
      requestAnimationFrame(() => {
        modal.querySelectorAll('.stat-fill').forEach(el => el.style.width = `${Math.min(100, Number(el.dataset.value))}%`);
        modalClose.focus();
      });
      document.getElementById('screenreader-status').textContent = `Opened ${agent.name}, ${agent.role}.`;
    }

    function closeModal() {
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden','true');

      resetView();
      if (lastFocusedElement && lastFocusedElement.focus) lastFocusedElement.focus();

    modalClose.addEventListener('click', closeModal);

    const departments = ['All', ...new Set(agents.map(agent => agent.department))];
    const counts = Object.fromEntries(departments.map(dep => [dep, dep === 'All' ? agents.length : agents.filter(agent => agent.department === dep).length]));
    filterRail.innerHTML = departments.map(dep => `<button class="filter-button ${dep === 'All' ? 'is-active' : ''}" type="button" data-department="${dep}"><strong>${dep}</strong><span>${counts[dep]} registered</span></button>`).join('');
    filterRail.addEventListener('click', event => {
      const button = event.target.closest('button[data-department]');
      if (!button) return;
      activeFilter = button.dataset.department;
      filterRail.querySelectorAll('.filter-button').forEach(item => item.classList.toggle('is-active', item === button));
      agentObjects.forEach((object, id) => {
        const agent = agents.find(item => item.id === id);
        const match = activeFilter === 'All' || agent.department === activeFilter;
        object.image.material.opacity = match ? 1 : .18;
        object.image.material.transparent = !match;
        object.frame.material.opacity = match ? 1 : .22;
        object.frame.material.transparent = !match;
        object.halo.material.opacity = match ? .075 : .01;
        gsap.to(object.group.scale, { x:match ? 1 : .92, y:match ? 1 : .92, z:match ? 1 : .92, duration:.4 });
      });
      document.getElementById('agent-count').textContent = `${counts[activeFilter]} active`;
      document.getElementById('screenreader-status').textContent = `Showing ${counts[activeFilter]} ${activeFilter} agents.`;
    });

    // Roster panel and search
    const rosterPanel = document.getElementById('roster-panel');
    const rosterButton = document.getElementById('roster-button');
    const rosterClose = document.getElementById('roster-close');
    const rosterSearch = document.getElementById('roster-search');
    const rosterList = document.getElementById('roster-list');

    function renderRoster(query='') {
      const q = query.trim().toLowerCase();
      const filtered = agents.filter(agent => !q || [agent.name,agent.role,agent.department,agent.rarity,agent.function,agent.ability].join(' ').toLowerCase().includes(q));
      rosterList.innerHTML = filtered.map(agent => `
        <button class="roster-item" type="button" data-agent-id="${agent.id}">
          <span class="roster-number">${agent.cardNumber}</span>
          <span><strong>${agent.name}</strong><small>${agent.role} · ${agent.department}</small></span>
          <span class="rarity-mini">${agent.rarity}</span>
        </button>`).join('');
      if (!filtered.length) rosterList.innerHTML = '<p style="color:#8f897c;font-size:12px;padding:12px">No registry entries match that search.</p>';
    }
    renderRoster();

    function setRoster(open) {
      rosterOpen = open;
      rosterPanel.classList.toggle('is-open', open);
      rosterPanel.setAttribute('aria-hidden', String(!open));
      rosterButton.setAttribute('aria-expanded', String(open));
      if (open) { controls.autoRotate = false; updateOrbitUI(); setTimeout(() => rosterSearch.focus(), 100); }
      else { rosterButton.focus(); controls.autoRotate = orbitEnabled && !reducedMotion; updateOrbitUI(); }
    }
    rosterButton.addEventListener('click', () => setRoster(true));
    rosterClose.addEventListener('click', () => setRoster(false));
    rosterSearch.addEventListener('input', () => renderRoster(rosterSearch.value));
    rosterList.addEventListener('click', event => {
      const button = event.target.closest('[data-agent-id]');
      if (!button) return;
      const agent = agents.find(item => item.id === Number(button.dataset.agentId));
      if (!agent) return;
      setRoster(false);
      focusAgent(agent, true);
    });

    // Orbit control
    const orbitButton = document.getElementById('auto-rotate-button');
    const orbitIndicator = document.getElementById('rotate-indicator');
    function updateOrbitUI() {
      const active = controls.autoRotate;
      orbitButton.setAttribute('aria-pressed', String(active));
      orbitIndicator.classList.toggle('off', !active);
    }
    orbitButton.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      orbitEnabled = controls.autoRotate;
      updateOrbitUI();
    });
    updateOrbitUI();

    window.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (modalOpen) closeModal();
        else if (rosterOpen) setRoster(false);
      }
      if (event.key.toLowerCase() === 'r' && !modalOpen && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) setRoster(!rosterOpen);
    });

    // Loading
    const loadingScreen = document.getElementById('loading-screen');
    const uiLayer = document.getElementById('ui-layer');
    let revealed = false;
    function reveal() {
      if (revealed) return;
      revealed = true;
      loadingScreen.classList.add('is-hidden');
      uiLayer.classList.add('is-ready');
    }
    manager.onLoad = reveal;
    manager.onError = url => console.warn('Texture failed to load:', url);
    setTimeout(reveal, 4500);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (!reducedMotion) {
        core.rotation.x = t * .15; core.rotation.y = t * .24;
        coreGroup.children.slice(1).forEach((ring,index) => { ring.rotation.z = t * (.08 + index * .025) * (index % 2 ? -1 : 1); });
        particles.rotation.y = t * .018;
        galleryGroup.position.y = Math.sin(t * .4) * .08;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
