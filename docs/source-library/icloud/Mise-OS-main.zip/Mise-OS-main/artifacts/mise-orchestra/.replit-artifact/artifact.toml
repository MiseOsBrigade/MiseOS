kind = "video"
previewPath = "/"
title = "Mise Orchestra: 75 Variants"
version = "1.0.0"
id = "artifacts/mise-orchestra"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23052

[services.development]
run = "pnpm --filter @workspace/mise-orchestra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mise-orchestra", "run", "build" ]
publicDir = "artifacts/mise-orchestra/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23052"
BASE_PATH = "/"
