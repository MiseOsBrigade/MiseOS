<svg xmlns="http://www.w3.org/2000/svg" width="744" height="1039" viewBox="0 0 744 1039" role="img" aria-labelledby="title desc">
  <title id="title">MiseOS original collectible workflow card template</title>
  <desc id="desc">A black, cream, and gold collectible card frame for MiseOS workflow operators.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F6D978"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8C6A13"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0E0F10"/>
      <stop offset="1" stop-color="#182A41"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="744" height="1039" rx="44" fill="url(#ink)"/>
  <rect x="24" y="24" width="696" height="991" rx="34" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <rect x="46" y="46" width="652" height="947" rx="26" fill="#F6F1E7" opacity="0.04" stroke="#D4AF37" stroke-opacity="0.42"/>

  <g filter="url(#shadow)">
    <rect x="62" y="68" width="620" height="108" rx="22" fill="#0E0F10" stroke="#D4AF37" stroke-width="3"/>
    <text x="92" y="116" fill="#F6F1E7" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">MISEOS OPERATOR</text>
    <text x="92" y="150" fill="#D4AF37" font-family="Space Mono, monospace" font-size="18">MO-000 · BRIGADE · RARITY</text>
  </g>

  <rect x="78" y="205" width="588" height="385" rx="28" fill="#0E0F10" stroke="#D4AF37" stroke-width="4"/>
  <circle cx="372" cy="382" r="126" fill="#D4AF37" opacity="0.15"/>
  <path d="M172 505 C262 420 282 306 372 284 C462 306 482 420 572 505" fill="none" stroke="#D4AF37" stroke-width="5" opacity="0.5"/>
  <text x="372" y="389" fill="#D4AF37" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">PORTRAIT SLOT</text>

  <rect x="78" y="620" width="588" height="86" rx="18" fill="#0E0F10" stroke="#D4AF37" stroke-width="2"/>
  <text x="106" y="655" fill="#F6F1E7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">ROLE · ARCHETYPE · PRIMARY TOOL</text>
  <text x="106" y="684" fill="#D4AF37" font-family="Space Mono, monospace" font-size="16">single-player deployment action</text>

  <rect x="78" y="730" width="588" height="166" rx="18" fill="#F6F1E7" opacity="0.08" stroke="#D4AF37" stroke-width="2"/>
  <text x="106" y="768" fill="#F6F1E7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">ACTIVE ABILITY</text>
  <text x="106" y="808" fill="#F6F1E7" font-family="Inter, Arial, sans-serif" font-size="18">Execute workflow, validate artifact, emit operator report.</text>
  <text x="106" y="856" fill="#D4AF37" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">ULTIMATE</text>
  <text x="106" y="884" fill="#F6F1E7" font-family="Inter, Arial, sans-serif" font-size="18">Plan → Execute → Verify → Package → Deploy.</text>

  <g transform="translate(78 918)">
    <rect width="588" height="62" rx="16" fill="#0E0F10" stroke="#D4AF37" stroke-width="2"/>
    <text x="24" y="39" fill="#D4AF37" font-family="Space Mono, monospace" font-size="18">ORCH 00 · BUILD 00 · RUN 00 · SEC 00 · INS 00 · STAM 00</text>
  </g>
</svg>
