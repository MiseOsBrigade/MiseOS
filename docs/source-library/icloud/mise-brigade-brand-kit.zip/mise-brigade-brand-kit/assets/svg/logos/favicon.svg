<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">Mise Brigade de Repo favicon</title>
<desc id="desc">Chef-code inspired repository brand asset</desc>
<defs>
  <linearGradient id="miseFlame" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F6C453"/>
