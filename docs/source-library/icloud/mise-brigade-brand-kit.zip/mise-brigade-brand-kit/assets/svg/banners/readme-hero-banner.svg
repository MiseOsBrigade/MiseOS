<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Mise Brigade de Repo README banner</title>
<desc id="desc">Chef-code inspired repository brand asset</desc>
<defs>
  <linearGradient id="miseFlame" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F6C453"/>
    <stop offset="52%" stop-color="#FF7A1A"/>
    <stop offset="100%" stop-color="#EF4444"/>
  </linearGradient>
  <linearGradient id="miseSteel" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1F2937"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="miseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#7CFFB2"/>
  </linearGradient>
  <radialGradient id="ember" cx="50%" cy="46%" r="70%">
    <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.32"/>
    <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <pattern id="prepGrid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.12" stroke-width="1"/>
  </pattern>
  <style>
    .title { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; font-size: 72px; font-weight: 800; letter-spacing: -2px; fill: #F8F3E8; }
    .subtitle { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; font-size: 25px; font-weight: 600; fill: #94A3B8; letter-spacing: .5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #7CFFB2; }
    .micro { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #94A3B8; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; font-size: 34px; font-weight: 800; fill: #F8F3E8; }
    .small { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; font-size: 18px; font-weight: 650; fill: #94A3B8; }
  </style>
</defs>
<rect width="1600" height="520" rx="44" fill="#0B0F14"/>
<rect width="1600" height="520" rx="44" fill="url(#prepGrid)"/>
<circle cx="1152.0" cy="145.6" r="218.4" fill="url(#ember)"/>

<g opacity=".42" stroke="#94A3B8" stroke-width="2" fill="none">
  <path d="M60 430H250q35 0 35-35V280h180"/>
  <path d="M1530 76H1340q-32 0-32 32v84H1070"/>
  <path d="M832 458v-85h185"/>
  <circle cx="250" cy="430" r="5" fill="#7CFFB2" stroke="none"/>
  <circle cx="1340" cy="76" r="5" fill="#38BDF8" stroke="none"/>
  <circle cx="832" cy="458" r="5" fill="#FF7A1A" stroke="none"/>
</g>
<g transform="translate(1080 64) rotate(4)">
  <rect width="370" height="280" rx="36" fill="#111827" stroke="#94A3B8" stroke-opacity=".28"/>
  <text x="42" y="68" class="mono">&lt;prep.station /&gt;</text>
  <path d="M42 116h280M42 158h230M42 200h270" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" opacity=".23"/>
  <circle cx="320" cy="60" r="18" fill="url(#miseFlame)"/>
</g>

<g transform="translate(242 191) scale(0.78)" filter="url(#softGlow)">
  <path d="M-94 30c-25-16-30-51-7-73 15-15 36-18 55-9 9-24 31-41 58-41s49 17 58 41c19-9 40-6 55 9 23 22 18 57-7 73v60H-94Z"
        fill="#0B0F14" stroke="#F8F3E8" stroke-width="10" stroke-linejoin="round"/>
  <path d="M-58 88h116" stroke="url(#miseFlame)" stroke-width="11" stroke-linecap="round"/>
  <path d="M-114 2l-38 38 38 38M114 2l38 38-38 38" fill="none" stroke="#38BDF8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-36 25c28-18 48-18 72 0M-22 58h44M0-55v36" stroke="#7CFFB2" stroke-width="8" stroke-linecap="round" opacity=".95"/>
  <circle cx="-46" cy="-33" r="6" fill="#F6C453"/>
  <circle cx="48" cy="-33" r="6" fill="#FF7A1A"/>
</g>
<text x="410" y="180" class="title">Mise Brigade de Repo</text>
<text x="414" y="234" class="subtitle">Everything in its place: branch flow, steward checks, safe automation, readable repo rituals.</text>
<g transform="translate(414 287)">
  <rect width="840" height="74" rx="28" fill="#111827" stroke="url(#miseGlow)" stroke-opacity=".70"/>
  <text x="34" y="47" class="mono">GITHUB_TOKEN · scoped permissions · no PAT recursion · apply-gated writes</text>
</g>
<text x="414" y="420" class="small">Part of the Mise en Place Hub · Code Chef Edition</text>
</svg>