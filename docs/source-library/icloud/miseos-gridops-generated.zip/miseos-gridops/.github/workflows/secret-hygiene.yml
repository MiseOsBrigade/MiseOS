name: Secret Hygiene

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check sensitive file patterns
        shell: bash
        run: |
          echo "Checking sensitive file patterns"
          find . -name ".env" -o -name "*.pem" -o -name "*.key" -o -path "./secrets/*" | sed 's#^./##' || true
          echo "Do not print secret values. Only paths are allowed."
