name: "Mise PR"
description: "Turn chaotic pull requests into review-ready packets before humans or AI agents review them."
author: "GoodShyt Group"
branding:
  icon: "check-square"
  color: "blue"
inputs:
  base-ref:
    description: "Base git ref"
    required: false
    default: "origin/main"
  head-ref:
    description: "Head git ref"
    required: false
    default: "HEAD"
  fail-on:
    description: "Fail on this risk level: green, yellow, amber, red, never"
    required: false
    default: "red"
  comment:
    description: "Post the review packet as a PR comment using github-script"
    required: false
    default: "false"
outputs:
  report-path:
    description: "Path to the generated Markdown report"
    value: "mise-pr-report.md"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install Mise PR
      shell: bash
      run: python -m pip install .
    - name: Extract PR body
      shell: bash
      run: python -m mise_pr.pr_body
    - name: Generate review packet
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
      run: |
        mise-pr analyze \
          --base "${{ inputs.base-ref }}" \
          --head "${{ inputs.head-ref }}" \
          --title "$PR_TITLE" \
          --body-file ".mise-pr-body.md" \
          --repository "${{ github.repository }}" \
          --author "${{ github.actor }}" \
          --output "mise-pr-report.md" \
          --json-output "mise-pr-report.json" \
          --fail-on "${{ inputs.fail-on }}"
    - name: Comment on PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs')
          const body = fs.readFileSync('mise-pr-report.md', 'utf8')
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            body
          })
