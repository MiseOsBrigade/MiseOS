<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MiseOS Spatial Brigade Catalog</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header>
  <div>
    <p class="eyebrow">MISEOS // SPATIAL BRIGADE CATALOG</p>
    <h1>112 Character Agents</h1>
    <p>Every repository becomes a kitchen. Every operator has a station, command, proof gate, and media layer.</p>
  </div>
  <div class="count"><strong>112</strong><span>characters</span><strong>23</strong><span>registry manifests</span></div>
</header>
<section class="controls">
  <input id="search" placeholder="Search name, role, command…"/>
  <select id="department"><option value="">All departments</option></select>
  <select id="rarity"><option value="">All rarities</option></select>
</section>
<main id="grid"></main>
<dialog id="drawer"><button id="close">×</button><div id="detail"></div></dialog>
<script src="app.js"></script>
</body>
</html>
