name: Supermemory Records Validation
on:
  pull_request:
    paths: ["supermemory/**"]
  push:
    branches: [main]
    paths: ["supermemory/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix supermemory run validate
