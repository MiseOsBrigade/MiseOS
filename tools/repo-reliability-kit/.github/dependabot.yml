# Dependabot configuration — grouped, weekly, low-noise.
# Delete the ecosystems you don't use. Uncomment the ones you do.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:

  # --- npm (JavaScript/TypeScript) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm"]
    ignore:
      # Example: hold major version bumps for manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

