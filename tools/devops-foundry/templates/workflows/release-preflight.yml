name: MiseOS Release Preflight
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, for example 1.4.0.
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/release-sentinel
        with:
          version: ${{ inputs.version }}
          fail-on-error: "true"
