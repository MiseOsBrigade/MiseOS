name: GCP Lazy Mint CI

on:
  pull_request:
    paths:
      - "services/**"
      - "infra/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/gcp-lazy-mint-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "infra/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: python -m compileall services scripts

      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
