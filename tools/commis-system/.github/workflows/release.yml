name: Package Repository Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true
        default: "v0.1.1"
        type: string
      release_name:
        description: "Release title"
        required: true
        default: "Mise de Commis System v0.1.1"
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        default: false
        type: boolean
      replace_existing:
        description: "Replace an existing release and tag with the same name"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: package-release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "Release tag cannot be empty." >&2
            exit 1
          fi

          if [[ "$TAG" =~ [[:space:]] ]]; then
            echo "Release tag cannot contain spaces: $TAG" >&2
            exit 1
          fi

      - name: Build repository archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          SAFE_TAG="${TAG//\//-}"
          ASSET_NAME="mise-de-commis-system-${SAFE_TAG}.zip"
          CHECKSUM_NAME="mise-de-commis-system-${SAFE_TAG}.sha256"

          git archive --format=zip --output "$ASSET_NAME" HEAD
          sha256sum "$ASSET_NAME" > "$CHECKSUM_NAME"

          {
            echo "asset_name=$ASSET_NAME"
            echo "checksum_name=$CHECKSUM_NAME"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          CHECKSUM_NAME: ${{ steps.package.outputs.checksum_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=("--prerelease")
          else
            RELEASE_FLAGS+=("--latest")
          fi

          NOTES="Automated repository package generated from commit $GITHUB_SHA."

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$REPLACE_EXISTING" != "true" ]]; then
              echo "Release $TAG already exists. Enable replace_existing or choose a new tag." >&2
              exit 1
            fi

            echo "Existing release found for $TAG. Replacing release and tag."
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$ASSET_NAME" "$CHECKSUM_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes "$NOTES" \
            "${RELEASE_FLAGS[@]}"

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "# Release Published"
            echo ""
            echo "- **Tag**: ${{ steps.package.outputs.tag }}"
            echo "- **Asset**: ${{ steps.package.outputs.asset_name }}"
            echo "- **Checksum**: ${{ steps.package.outputs.checksum_name }}"
            echo "- **Commit**: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
